name: release-check

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/*.test.mjs"
      - run: node skills/export/scripts/validate-release.mjs
      - run: RUN_MERMAID=1 node --test tests/render.test.mjs
