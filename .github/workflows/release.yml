name: release-check

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check commit messages
        run: node tools/check-commit-policy.mjs
      - run: node --test tests/adapter.test.mjs tests/canonical.test.mjs tests/cli.test.mjs tests/core.test.mjs tests/coverage.test.mjs tests/independence.test.mjs tests/ingest.test.mjs tests/manifest.test.mjs tests/mcp.test.mjs tests/migration.test.mjs tests/package.test.mjs tests/policy.test.mjs tests/project.test.mjs tests/query.test.mjs tests/reconstruct.test.mjs tests/render-mermaid.test.mjs tests/render.test.mjs tests/security.test.mjs tests/store.test.mjs tests/test-files.test.mjs tests/verify.test.mjs tests/zip.test.mjs
      - run: node scripts/mcp-server.mjs --self-test
      - run: node skills/export/scripts/validate-release.mjs
      - name: Install the pinned Mermaid CLI
        run: npm install --no-save --no-package-lock @mermaid-js/mermaid-cli@12.2.0
      - name: Render the Mermaid fixture
        run: RUN_MERMAID=1 node --test tests/render-mermaid.test.mjs
