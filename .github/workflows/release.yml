name: release-check

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node scripts/mcp-server.mjs --self-test
      - run: node skills/export/scripts/validate-release.mjs
      - name: Install the pinned Mermaid CLI
        run: npm install --no-save --no-package-lock @mermaid-js/mermaid-cli@12.2.0
      - name: Render the Mermaid fixture
        run: RUN_MERMAID=1 node --test tests/render-mermaid.test.mjs
